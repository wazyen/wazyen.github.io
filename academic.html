<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Academic & Game Jam Archive | Fran Moreno</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-slate-950 text-slate-100 font-sans antialiased selection:bg-indigo-500 selection:text-white relative">
<div class="fixed inset-0 bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-indigo-900/20 via-slate-950 to-slate-950 -z-10"></div>

<div class="max-w-5xl mx-auto px-6 py-12 space-y-12">
    <!-- Navigation -->
    <nav class="flex justify-between items-center pb-6 border-b border-slate-800/80">
        <span class="font-bold text-lg text-white">Fran Moreno Jiménez</span>
        <div class="flex gap-6 text-sm font-medium">
            <a href="index.html" class="text-slate-400 hover:text-white transition-colors">Portfolio</a>
            <a href="academic.html" class="text-indigo-400">Academic & Jams</a>
        </div>
    </nav>

    <header class="space-y-3">
        <h1 class="text-3xl font-extrabold text-white">Academic & Game Jam Archive</h1>
        <p class="text-slate-400 text-sm max-w-xl">
            A complete collection of university projects, hackathons, and game jams from my student and early experimental years.
        </p>
    </header>

    <section id="academic-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6"></section>

    <!-- Footer -->
    <footer class="pt-8 border-t border-slate-900 text-center text-slate-600 text-xs flex flex-col sm:flex-row justify-between items-center gap-4">
        <p>&copy; <span id="current-year"></span> Fran Moreno Jiménez</p>
        <p class="text-slate-500">Hosted on GitHub Pages</p>
    </footer>
</div>

<!-- Scroll to Top Button -->
<button id="scroll-to-top" aria-label="Scroll to top" class="fixed bottom-6 right-6 p-3 rounded-full bg-slate-900/90 border border-slate-700/80 text-indigo-400 hover:bg-indigo-600 hover:text-white shadow-xl transition-all duration-300 opacity-0 pointer-events-none z-50 focus:outline-none">
    <i data-lucide="chevron-up" class="w-5 h-5"></i>
</button>

<!-- TEMPLATE FOR ACADEMIC PROJECTS (TRUE SQUARE TOP THUMBNAIL) -->
<template id="academic-card-template">
    <div class="project-card bg-slate-900/60 border border-slate-800 rounded-xl overflow-hidden flex flex-col justify-between hover:border-slate-700 transition-all">
        <!-- True Square Image Container -->
        <div class="w-full aspect-square relative overflow-hidden bg-slate-950">
            <img data-img src="" alt="" class="img-zoom w-full h-full object-cover">
        </div>
        <!-- Details Container -->
        <div class="p-5 flex-1 flex flex-col justify-between space-y-3">
            <div class="space-y-2">
                <div class="flex justify-between items-start">
                    <h3 data-title class="text-base font-bold text-white"></h3>
                    <span data-year class="text-xs font-mono text-slate-500"></span>
                </div>
                <span data-subtitle class="text-xs text-indigo-400 font-medium block"></span>
                <div data-tags class="flex flex-wrap gap-1.5 pt-1"></div>
                <p data-description class="text-slate-400 text-xs leading-relaxed pt-1"></p>
            </div>
            <div data-links class="pt-3 border-t border-slate-800/60 flex flex-wrap gap-3"></div>
        </div>
    </div>
</template>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        document.getElementById('current-year').textContent = new Date().getFullYear();

        if (window.lucide) {
            lucide.createIcons();
        }

        const scrollTopBtn = document.getElementById('scroll-to-top');
        window.addEventListener('scroll', () => {
            if (window.scrollY > 300) {
                scrollTopBtn.classList.remove('opacity-0', 'pointer-events-none');
                scrollTopBtn.classList.add('opacity-100');
            } else {
                scrollTopBtn.classList.add('opacity-0', 'pointer-events-none');
                scrollTopBtn.classList.remove('opacity-100');
            }
        });

        scrollTopBtn.addEventListener('click', () => {
            window.scrollTo({ top: 0, behavior: 'smooth' });
        });
    });
</script>
<script type="module" src="js/main.js"></script>
</body>
</html>
